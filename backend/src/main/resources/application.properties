spring.application.name=ledger

# ---------------------------------------------------------------------------
# Database
#
# The ledger lives in a single SQLite file on this machine. LEDGER_DB_PATH can
# point it elsewhere (an encrypted volume, for example). The file and its -wal
# sidecar contain the user's complete financial history in plaintext: see the
# README's security section.
#
# URL parameters rather than Hikari's connection-init-sql, because that setting
# accepts only one statement and three pragmas are needed:
#   foreign_keys=on  - SQLite defaults FK enforcement OFF, per connection. The
#                      source-record -> transaction links are load-bearing, so
#                      this must be on for every pooled connection.
#   journal_mode=WAL - lets the scheduled sync write while the UI reads.
#   busy_timeout     - wait rather than fail immediately on a write lock.
# ---------------------------------------------------------------------------
ledger.db.path=${LEDGER_DB_PATH:./data/ledger.db}
spring.datasource.url=jdbc:sqlite:${ledger.db.path}?foreign_keys=on&journal_mode=WAL&busy_timeout=10000
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite permits exactly one writer at a time. A single pooled connection makes
# every write serialise in the application rather than surfacing as SQLITE_BUSY
# under concurrent sync + UI activity. For a single-user local app the
# throughput cost is irrelevant and the correctness gain is not.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.pool-name=ledger-sqlite

# ---------------------------------------------------------------------------
# JPA / Hibernate
#
# Flyway owns the schema. ddl-auto=validate makes the application refuse to
# start if the entities and the migrated schema have drifted, which is a far
# better failure than silently writing to a column that is not there.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Batching is disabled: with a single connection and SQLite's statement-level
# locking it buys nothing, and it complicates the ordering of the dedup writes.
spring.jpa.properties.hibernate.order_inserts=false

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ---------------------------------------------------------------------------
# Web
# ---------------------------------------------------------------------------
server.port=${LEDGER_PORT:8080}
# Bind to loopback only. This application has no authentication; exposing it on
# a LAN or the internet would publish the user's financial records to anyone who
# can reach the port. See the README before changing this.
server.address=${LEDGER_BIND_ADDRESS:127.0.0.1}
server.error.include-message=always
server.error.include-binding-errors=always
spring.mvc.problemdetails.enabled=true
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Uploaded CSV/JSON files for import and restore.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ---------------------------------------------------------------------------
# Synchronization
# ---------------------------------------------------------------------------
# How often connected providers are polled while the backend is running. A
# local backend obviously cannot sync while this machine is asleep or off; the
# next poll after wake-up catches up from the stored cursor.
ledger.sync.enabled=${LEDGER_SYNC_ENABLED:true}
ledger.sync.interval=${LEDGER_SYNC_INTERVAL:PT15M}
# Delay before the first poll after startup, so migrations and warm-up finish.
ledger.sync.initial-delay=PT30S
# How far back a first-time historical import reaches.
ledger.sync.backfill-days=${LEDGER_BACKFILL_DAYS:180}
# Messages fetched per provider call during backfill.
ledger.sync.page-size=50
# Give up on a source record after this many failed parse/match attempts; it
# then lands in the exception queue rather than retrying forever.
ledger.sync.max-attempts=5

# ---------------------------------------------------------------------------
# Gmail OAuth
#
# Not set by default: the integration is inert until the user creates their own
# Google Cloud OAuth client. See the README for the exact setup steps. Secrets
# come from the environment and are never committed.
# ---------------------------------------------------------------------------
ledger.gmail.client-id=${GMAIL_CLIENT_ID:}
ledger.gmail.client-secret=${GMAIL_CLIENT_SECRET:}
ledger.gmail.redirect-uri=${GMAIL_REDIRECT_URI:http://127.0.0.1:8080/api/sources/gmail/callback}

# ---------------------------------------------------------------------------
# Token encryption
#
# OAuth refresh tokens are encrypted at rest with AES-GCM. The key is read from
# LEDGER_TOKEN_KEY (base64, 32 bytes) or, when absent, generated once and stored
# in a 0600 file beside the database. Rotating the key invalidates stored tokens
# and requires reconnecting the provider.
# ---------------------------------------------------------------------------
ledger.security.token-key=${LEDGER_TOKEN_KEY:}
ledger.security.token-key-file=${LEDGER_TOKEN_KEY_FILE:./data/token.key}

# ---------------------------------------------------------------------------
# Logging
#
# Message bodies, subjects and amounts must not reach the logs. Parser and
# ingestion classes log counts, ids and decisions only. SQL logging is off for
# the same reason: bound parameters would include amounts and merchant names.
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.ledger=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.flywaydb=INFO

# ---------------------------------------------------------------------------
# Frontend
# ---------------------------------------------------------------------------
# Base URL the Vite dev server listens on, used for CORS and OAuth callback
# redirects. In production, point this at wherever you serve the built frontend.
ledger.frontend.base-url=${LEDGER_FRONTEND_URL:http://localhost:5173}
